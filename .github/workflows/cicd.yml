name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip wget ca-certificates \
            libfontconfig1 libx11-6 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libgl1 libxext6 libxrender1 libxfixes3 \
            libxkbcommon0 libdbus-1-3 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-4.7.2
          key: godot-4.7.2-stable-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root="$HOME/.cache/godot-4.7.2"
          mkdir -p "$root/bin" /tmp/godot-dl
          wget -q -O /tmp/godot-dl/editor.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-dl/editor.zip -d "$root/bin"
          chmod +x "$root/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          wget -q -O /tmp/godot-dl/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf "$root/templates"
          unzip -q /tmp/godot-dl/templates.tpz -d /tmp/godot-dl
          mv /tmp/godot-dl/templates "$root/templates"

      - name: Expose Godot
        run: |
          set -euo pipefail
          root="$HOME/.cache/godot-4.7.2"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          ln -sfn "$root/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          sudo ln -sfn "$root/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Gameplay tests
        run: |
          set -euo pipefail
          godot --headless --path . --import
          godot --headless --path . -- --test

      - name: Export web
        run: ./build_web.sh

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add host
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          tar -C web -czf /tmp/pjclash-web.tar.gz .
          scp /tmp/pjclash-web.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/pjclash-web.tar.gz
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} /bin/bash << SCRIPT
            set -euo pipefail
            dest='${{ secrets.DEPLOY_PATH }}'
            case "\$dest" in
              /*) ;;
              *) echo "DEPLOY_PATH must be an absolute path"; exit 1 ;;
            esac
            case "\$dest" in
              /|/home|/root|/var|/usr|/tmp|/opt) echo "DEPLOY_PATH is too broad"; exit 1 ;;
            esac
            mkdir -p "\$dest"
            find "\$dest" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf /tmp/pjclash-web.tar.gz -C "\$dest"
            rm -f /tmp/pjclash-web.tar.gz
            echo "Deployed to \$dest"
          SCRIPT
