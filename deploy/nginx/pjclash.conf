# PJ's Clash — static web build.
#
# The GitHub Action copies the Godot export into DEPLOY_PATH. This file is the
# one-time nginx site in front of that directory. It is not applied by CI.
#
# Installation:
#   1. Copy this file to /etc/nginx/sites-available/pjclash
#   2. Set server_name and root (root must be the DEPLOY_PATH secret).
#      The SSH user has to be able to replace the files there. If this
#      directory is root-owned, either chown it to that user or give them
#      passwordless sudo.
#   3. Enable: sudo ln -s /etc/nginx/sites-available/pjclash /etc/nginx/sites-enabled/
#   4. Test: sudo nginx -t && sudo systemctl reload nginx
#
# The export is single-threaded, so it does not need cross-origin isolation
# headers. .wasm must be served as application/wasm or the page will not boot.

server {
    listen 80;
    server_name pjclash.yourdomain.com;  # CHANGE THIS

    root /var/www/pjclash;  # CHANGE THIS to DEPLOY_PATH
    index index.html;

    access_log /var/log/nginx/pjclash-access.log;
    error_log /var/log/nginx/pjclash-error.log;

    add_header X-Content-Type-Options "nosniff" always;

    # Filenames stay index.wasm / index.pck across deploys, so don't cache them
    # for long or a new build keeps playing the old one.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
    }

    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream text/css;
}
