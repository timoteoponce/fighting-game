[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Threaded build: better framerate and low-latency audio. Requires a secure,
; cross-origin-isolated page, so nginx sends COOP/COEP and the site is HTTPS
; (see deploy/nginx/pjclash.conf). Without both the game refuses to boot.
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://export/web_shell.html"
html/head_include=""
; 0 = None: the shell sizes the canvas to the window at pixel ratio 1 (see
; web_shell.html). "Adaptive" (2) sizes the WebGL backing store by the device
; pixel ratio, so a 2.5-3x phone pushes ~9x the pixels for a 320x180 game.
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
