encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Threaded build: better framerate and low-latency audio. Requires a secure,
; cross-origin-isolated page, so nginx sends COOP/COEP and the site is HTTPS
; (see deploy/nginx/pjclash.conf). Without both the game refuses to boot.
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://export/web_shell.html"
html/head_include=""
; 0 = None: the shell sizes the canvas to the window at pixel ratio 1 (see
; web_shell.html). "Adaptive" (2) sizes the WebGL backing store by the device
; pixel ratio, so a 2.5-3x phone pushes ~9x the pixels for a 320x180 game.
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.2]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/PJsClash.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

custom_template/debug=""
custom_template/release=""
; The prebuilt template path: no Gradle build, no permissions, no plugins.
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
gradle_build/custom_theme_attributes={}
; arm64 only: every phone since ~2016 runs it, and a second ABI would double
; the APK. Flip armeabi-v7a on if someone shows up with a 32-bit device.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; Keystores stay empty in the repo. The export reads GODOT_ANDROID_KEYSTORE_*
; environment variables first (build_android.sh sets them; CI injects the
; stable key from secrets), so no credentials are ever committed.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
version/code=1
version/name=""
package/unique_name="io.github.timoteoponce.pjsclash"
package/name=""
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
; Icons all fall back to application/config/icon (art/icon.png) in
; project.godot, which tools/make_icon.gd renders from the game's own
; FighterRenderer.
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
shader_baker/enabled=false
xr_features/xr_mode=0
gesture/swipe_to_dismiss=false
screen/immersive_mode=true
screen/edge_to_edge=false
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
; The game's night colour, so launch and the Android 12+ splash don't flash
; white before the first frame.
screen/background_color=Color(0.05, 0.02, 0.12, 1)
splash_screen/icon=""
splash_screen/branding_image=""
splash_screen/background_color=Color(0.05, 0.02, 0.12, 1)
; No Godot logo on boot — the game's own SplashScreen is the only intro.
splash_screen/disable_godot_boot_splash=true
user_data_backup/allow=false
command_line/extra_args=""
permissions/custom_permissions=PackedStringArray()
; All permissions/* stay false: the game needs none of them.
